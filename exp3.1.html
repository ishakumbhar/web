<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Webpage</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Welcome to My Webpage</h1>
        <p>A simple webpage styled using external CSS</p>
    </header>

    <main>
        <section class="content">
            <h2>About This Page</h2>
            <p>
                This webpage demonstrates how an external CSS file can
                be used to change colors, fonts, sizes, and spacing.
            </p>

            <button>Learn More</button>
        </section>
    </main>

    <footer>
        <p>© 2026 My Webpage</p>
    </footer>

</body>
</html>
